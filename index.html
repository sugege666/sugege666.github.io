<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico">
<link rel="Bookmark" href="favicon.ico">
<title>sugegeMC2015 | 个人主页</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Consolas,"Courier New",monospace;
}
body{
    min-height: 100vh;
    background-color: #1a1a36;
    background-image: radial-gradient(#27274b 1px, transparent 1px);
    background-size: 24px 24px;
    padding:30px 20px;
    color:#fff;
}
.wrapper{
    max-width:460px;
    margin:0 auto;
    text-align:center;
}
.card{
    text-align:center;
}
.avatar-circle{
    width:320px;
    height:320px;
    border-radius:50%;
    overflow:hidden;
    background:#000;
    margin:0 auto 32px;
}
.avatar-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.name{
    font-size:36px;
    color:#ffffff;
    letter-spacing:3px;
    margin-bottom:12px;
}
.tag{
    font-size:22px;
    color:#ff66dd;
    margin-bottom:26px;
}
.desc{
    color:#bbbbdd;
    font-size:17px;
    line-height:1.7;
    margin-bottom:24px;
}

.btn-group{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:30px;
}
.link-btn{
    width:52px;
    height:52px;
    background:#2c2c58;
    border:1px solid #44447a;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.link-btn svg{
    width:28px;
    height:28px;
    fill:#fff;
}
.link-btn-img{
    width:28px;
    height:28px;
}
.link-btn:hover{
    background:#3b3b75;
}

.video-title{
    font-size:18px;
    margin-bottom:12px;
    color:#ff66dd;
}
.video-box iframe{
    width:100%;
    max-width:600px;
    height:340px;
    border-radius:6px;
    border:1px solid #44447a;
    margin-bottom:12px;
}
.video-box p{
    color:#bbbbdd;
    margin-bottom:16px;
}

/* ========== 右下角悬浮广告 ========== */
.ad-float-box{
    position: fixed;
    right:16px;
    bottom:16px;
    width:260px;
    background:#ffffff;
    border:1px solid #ddd;
    border-radius:6px;
    z-index:999;
    overflow:hidden;
    display:none;
}
.ad-close{
    position:absolute;
    top:6px;
    right:6px;
    width:26px;
    height:26px;
    background:#555;
    color:#fff;
    text-align:center;
    line-height:26px;
    font-size:18px;
    cursor:pointer;
    border-radius:4px;
    z-index:10;
}
.ad-close:hover{
    background:#e53935;
}
.ad-image{
    width:100%;
    height:130px;
    object-fit:cover;
    filter: blur(0.3px);
}
.ad-text{
    padding:8px 10px;
}
.ad-title{
    font-size:14px;
    color:#222;
    line-height:1.4;
    text-decoration:none;
    display:block;
}
.ad-title:hover{
    color:#0066cc;
}
.ad-tag{
    font-size:11px;
    color:#999;
    margin-top:4px;
}
@media(max-width:600px){
    .ad-float-box{
        width:180px;
    }
    .ad-image{
        height:90px;
    }
}

/* ========== 游戏上方横幅广告 ========== */
.game-ad-banner{
    position: relative;
    max-width: 600px;
    margin: 0 auto 18px;
    background: #2c2c58;
    border: 1px solid #44447a;
    border-radius: 10px;
    overflow: hidden;
    display: none;
}
.game-ad-link{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    color: #fff;
    text-decoration: none;
}
.game-ad-img{
    width: 120px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    filter: blur(0.3px);
}
.game-ad-text{
    text-align: left;
    flex: 1;
}
.game-ad-title{
    font-size: 16px;
    color: #ff66dd;
    margin-bottom: 4px;
}
.game-ad-desc{
    font-size: 13px;
    color: #bbbbdd;
    line-height: 1.4;
}
.game-ad-close{
    position: absolute;
    top: 8px;
    right: 10px;
    width: 24px;
    height: 24px;
    background: #666;
    color: #fff;
    text-align: center;
    line-height: 24px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 4px;
}
.game-ad-close:hover{
    background: #f00;
}
@media (max-width: 480px){
    .game-ad-link{
        flex-direction: column;
        text-align: center;
    }
    .game-ad-img{
        width: 100%;
        height: 100px;
    }
    .game-ad-text{
        text-align: center;
    }
}
</style>
</head>
<body>
<div class="wrapper">
    <div class="card">

        <div class="name">sugegeMC2015</div>

        <div class="btn-group">
            <a class="link-btn" target="_blank" href="https://space.bilibili.com/3546971895761087">

</div>

    <div class="ad-close" id="adClose">×</div>
    <a href="https://eagseed.gamer.gd/" target="_blank">
        <img class="ad-image" src="adimg.jpg" alt="广告图">

    <div class="ad-text">
        <a class="ad-title" href="https://eagseed.gamer.gd/" target="_blank">Eaglercraft海量种子库，一键查找地形！</a>
        <div class="ad-tag">推广 · MC网页版资源</div>
    </div>
</div>

<script>
//右下角广告
const adBox = document.getElementById('adBox');
const adClose = document.getElementById('adClose');
const storageKey = 'ad_closed';
if(localStorage.getItem(storageKey) !== '1'){
    adBox.style.display = 'block';
}
adClose.addEventListener('click',()=>{
    adBox.style.display = 'none';
    localStorage.setItem(storageKey,'1');
})

//横幅广告
const gameAdBanner = document.getElementById('gameAdBanner');
const gameAdClose = document.getElementById('gameAdClose');
const gameAdStorageKey = 'game_ad_closed';
if(localStorage.getItem(gameAdStorageKey) !== '1'){
    gameAdBanner.style.display = 'block';
}
gameAdClose.addEventListener('click',()=>{
    gameAdBanner.style.display = 'none';
    localStorage.setItem(gameAdStorageKey,'1');
});

</script>

</body>
</html>
